<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习闯关 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="practice-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/daily">每日一题</a>
                <a href="/practice" class="active">练习闯关</a>
                <a href="/drafts" data-auth-role="admin" hidden>草稿</a>
                <a href="/hidden" data-auth-role="admin" hidden>隐藏</a>
                <a href="/editor" data-auth-role="admin" hidden>创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体：整页平铺工作台（正文不滚，各面板独立滚动） -->
    <main class="container container-practice">
        <div class="practice-bar">
            <h1 class="practice-title">练习闯关</h1>
            <span class="practice-sub">C++ 后端知识 · 短题热身 + 项目 Boss 收口</span>
            <span class="practice-progress" id="practiceProgress"></span>
        </div>

        <div class="practice-layout">
            <!-- 左栏：章节 + 当前章题目（两级树，自身滚动） -->
            <aside class="practice-side">
                <div class="practice-side-head"><span>章节</span></div>
                <div class="practice-chapters" id="chapterList">
                    <div class="loading">加载中...</div>
                </div>
            </aside>

            <!-- 右栏：答题工作台 -->
            <div class="practice-work">
                <!-- 题目头（固定在工作台顶部） -->
                <div class="practice-work-head" id="workHead" hidden></div>

                <!-- 并排主体：题目描述卡 | 编辑器·作答 -->
                <div class="practice-work-body single" id="workBody">
                    <!-- 题目描述卡：标签栏（题目描述 | 题解）共用一栏，底部固定「测试结果」 -->
                    <section class="practice-card practice-prompt-card" id="questionCard">
                        <div class="practice-tabs" role="tablist" aria-label="题目内容">
                            <button type="button" class="practice-tab is-active" id="tabDesc" role="tab"
                                aria-selected="true" aria-controls="descPane">题目描述</button>
                            <button type="button" class="practice-tab" id="tabSolution" role="tab"
                                aria-selected="false" aria-controls="solutionPane">题解</button>
                        </div>
                        <!-- 面板一：题目描述（默认显示） -->
                        <div class="practice-desc-scroll" id="descPane" role="tabpanel" aria-labelledby="tabDesc">
                            <div id="promptHost">
                                <div class="practice-prompt practice-empty">从左侧选择一道题目开始练习。</div>
                            </div>
                        </div>
                        <!-- 面板二：题解（点「题解」标签后显示） -->
                        <div class="practice-desc-scroll" id="solutionPane" role="tabpanel"
                            aria-labelledby="tabSolution" hidden>
                            <div class="practice-solution-host" id="solutionHost"></div>
                        </div>
                        <!-- 测试结果：每次运行/提交后出现，固定在描述卡底部 -->
                        <section class="practice-result" id="resultCard" hidden>
                            <div class="practice-result-title">测试结果</div>
                            <div class="practice-result-body" id="resultBody"></div>
                        </section>
                    </section>

                    <!-- 写代码题：代码编辑器（IDE 观感：行号槽 + 语法高亮 + 状态栏） -->
                    <section class="practice-card practice-editor-card" id="editorCard" hidden>
                        <div class="practice-editor-head">
                            <span class="practice-editor-title">代码</span>
                            <span class="practice-editor-lang">C++20</span>
                        </div>
                        <div class="practice-code" id="codeShell">
                            <div class="practice-code-bar">
                                <span class="practice-code-file"><i class="practice-code-dot" aria-hidden="true"></i>solution.cpp</span>
                                <span class="practice-code-tip">Ctrl / ⌘ + Enter 运行</span>
                            </div>
                            <div class="practice-code-main">
                                <div class="practice-code-gutter" id="codeGutter" aria-hidden="true">1</div>
                                <div class="practice-code-body">
                                    <pre class="practice-code-hl" aria-hidden="true"><code id="codeHighlight"></code></pre>
                                    <textarea id="codeEditor" class="practice-code-input" spellcheck="false"
                                        autocomplete="off" autocapitalize="off" autocorrect="off"
                                        aria-label="C++ 代码编辑器"
                                        placeholder="在这里编写你的 C++ 代码..."></textarea>
                                </div>
                            </div>
                            <div class="practice-code-status">
                                <span id="codeStatusPos">行 1，列 1</span>
                                <span class="practice-code-status-right">C++20 · 缩进 4 空格 · UTF-8</span>
                            </div>
                        </div>
                        <div class="practice-editor-actions">
                            <button type="button" class="btn btn-primary" id="submitBtn">提交运行</button>
                            <button type="button" class="btn btn-secondary" id="resetBtn">重置代码</button>
                        </div>
                    </section>

                    <!-- 客观题（选择题）：作答区 -->
                    <section class="practice-card practice-answer-card" id="answerCard" hidden>
                        <div class="practice-answer-body" id="answerBody"></div>
                        <div class="practice-editor-actions">
                            <button type="button" class="btn btn-primary" id="answerSubmitBtn">提交答案</button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/daily-common.js"></script>
    <script src="/js/practice.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
