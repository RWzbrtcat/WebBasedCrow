<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一题 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="daily-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/daily" class="active">每日一题</a>
                <a href="/drafts" data-auth-role="admin" hidden>草稿</a>
                <a href="/hidden" data-auth-role="admin" hidden>隐藏</a>
                <a href="/editor" data-auth-role="admin" hidden>创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-daily">
        <h1 class="page-title">每日一题</h1>

        <div class="daily-layout">
            <!-- 左栏：历史题目 + 题目管理（仅站长），两张卡片共用一个吸顶容器 -->
            <div class="daily-rail">
                <aside class="daily-rail-history">
                    <h2 class="daily-rail-title">历史题目</h2>
                    <div class="daily-history" id="historyList">
                        <div class="loading">加载中...</div>
                    </div>
                </aside>

                <aside class="daily-rail-admin" data-auth-role="main" hidden>
                    <h2 class="daily-rail-title">题目管理</h2>
                    <a class="btn btn-primary btn-block" href="/daily/question" id="addQuestionBtn">添加题目</a>
                </aside>
            </div>

            <!-- 中栏：今日题目 + 题库浏览 -->
            <div class="daily-main">
                <!-- 今日题目 -->
                <section class="daily-card" id="todayCard">
                    <div class="loading">加载中...</div>
                </section>

                <!-- 题库：分类筛选 + 列表 -->
                <div class="daily-section-head" id="bankSectionHead">
                    <h2 class="daily-section-title">题库</h2>
                    <span class="daily-section-note" id="bankCount"></span>
                </div>
                <div class="filter-bar">
                    <div class="filter-row" id="categoryTabs"></div>
                </div>
                <div class="daily-list" id="questionList">
                    <div class="loading">加载中...</div>
                </div>
                <div class="daily-more">
                    <button type="button" class="btn btn-secondary" id="loadMoreBtn" hidden>加载更多</button>
                </div>
            </div>

            <!-- 右栏：我的打卡 / 题库分布（题目管理已移到左栏历史题目下方） -->
            <aside class="daily-aside">
                <section class="daily-side-card">
                    <h2 class="daily-side-title">我的打卡</h2>
                    <div class="streak-figure">
                        <span class="streak-num" id="streakNum">0</span>
                        <span class="streak-unit">天连答</span>
                    </div>
                    <p class="streak-status" id="streakStatus">今日尚未作答</p>
                    <div class="streak-week" id="streakWeek"></div>
                </section>

                <section class="daily-side-card">
                    <h2 class="daily-side-title">题库分布</h2>
                    <div class="cat-dist" id="catDist"></div>
                </section>
            </aside>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/daily-common.js"></script>
    <script src="/js/daily.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
