<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat's Blog</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/drafts">草稿</a>
                <a href="/editor" class="btn-write">写文章</a>
                <a href="/logout">退出</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-editor">
        <div class="editor-card">
            <h1 id="editorTitle">写文章</h1>
            <form id="postForm">
                <div class="form-row">
                    <div class="form-group form-row-item">
                        <label for="title">标题 *</label>
                        <input type="text" id="title" placeholder="输入文章标题..." required>
                    </div>
                    <div class="form-group form-row-item">
                        <label for="author">作者</label>
                        <input type="text" id="author" placeholder="作者名（留空默认为「匿名」）">
                    </div>
                </div>
                <div class="form-group">
                    <label for="topic">专栏</label>
                    <input type="text" id="topic">
                </div>
                <div class="form-group">
                    <label for="summary">内容简介</label>
                    <textarea id="summary" rows="3" placeholder="一句话概括这篇文章（可选，会显示在文章列表中）"></textarea>
                </div>
                <div class="form-group">
                    <label for="content">正文（支持 Markdown 语法）</label>
                    <div class="markdown-toolbar" id="markdownToolbar">
                        <button type="button" class="md-btn" data-action="undo" title="撤销 (Ctrl+Z)">撤销</button>
                        <button type="button" class="md-btn" data-action="redo" title="重做 (Ctrl+Y)">重做</button>
                        <span class="md-divider"></span>
                        <button type="button" class="md-btn md-btn-bold" data-action="bold" title="加粗">加粗</button>
                        <button type="button" class="md-btn md-btn-italic" data-action="italic" title="斜体">斜体</button>
                        <button type="button" class="md-btn" data-action="strike" title="删除线">删除线</button>
                        <span class="md-divider"></span>
                        <button type="button" class="md-btn" data-action="heading" title="二级标题">标题</button>
                        <button type="button" class="md-btn" data-action="quote" title="引用">引用</button>
                        <button type="button" class="md-btn" data-action="ul" title="无序列表">无序列表</button>
                        <button type="button" class="md-btn" data-action="ol" title="有序列表">有序列表</button>
                        <span class="md-divider"></span>
                        <button type="button" class="md-btn" data-action="code" title="行内代码">行内代码</button>
                        <button type="button" class="md-btn" data-action="codeblock" title="代码块">代码块</button>
                        <button type="button" class="md-btn" data-action="link" title="插入链接">链接</button>
                        <button type="button" class="md-btn" data-action="image" title="插入图片">插入图片</button>
                    </div>
                    <div class="markdown-editor">
                        <div class="markdown-editor-pane markdown-editor-input">
                            <div class="pane-label">Markdown 编辑</div>
                            <textarea id="content" placeholder="使用 Markdown 语法写下你的内容，例如：# 标题、**加粗**、- 列表、```代码块```..."></textarea>
                        </div>
                        <div class="markdown-editor-pane markdown-editor-preview">
                            <div class="pane-label">预览</div>
                            <div id="preview" class="markdown-body"></div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">发布</button>
                    <button type="button" class="btn btn-secondary" id="draftBtn">保存草稿</button>
                    <a href="/" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </main>

    <!-- 插入图片弹窗 -->
    <div class="image-modal-overlay" id="imageModal" hidden>
        <div class="image-modal" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
            <div class="image-modal-header">
                <h3 id="imageModalTitle">插入图片</h3>
                <button type="button" class="image-modal-close" id="imageModalClose" aria-label="关闭">&times;</button>
            </div>
            <div class="image-modal-body">
                <button type="button" class="btn btn-primary btn-block" id="imageUploadBtn">上传本地图片</button>
                <div class="image-modal-divider"><span>或使用图片链接</span></div>
                <input type="text" id="imageUrlInput" class="image-url-input" placeholder="https://example.com/pic.png">
                <button type="button" class="btn btn-secondary btn-block" id="imageUrlConfirmBtn">插入链接</button>
            </div>
        </div>
        <input type="file" id="imageFileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>
    </div>

    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/editor.js"></script>
    <script src="/js/background.js"></script>
</body>
</html>
