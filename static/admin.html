<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员管理 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/drafts">草稿</a>
                <a href="/editor">创作</a>
                <a href="/admin" class="active">管理员</a>
                <a href="/profile">个人</a>
                <a href="/logout">退出</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-login">
        <div class="login-card">
            <h1 class="login-title">管理员管理</h1>
            <p class="login-subtitle">仅主管理员可新增 / 删除管理员</p>

            <form id="adminForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="管理员登录邮箱" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="自定义密码" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">添加管理员</button>
                <p class="login-error" id="adminError" hidden></p>
            </form>

            <div class="admin-list" id="adminList">
                <div class="admin-list-title">加载中...</div>
            </div>
        </div>
    </main>

    <script src="/js/admin.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
