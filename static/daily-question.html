<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加题目 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="daily-question-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/posts">文章列表</a>
                <a href="/daily" class="active">每日一题</a>
                <a href="/practice">练习闯关</a>
                <div class="nav-dropdown nav-create" data-auth-role="admin" hidden>
                    <button type="button" class="nav-create-toggle" aria-haspopup="true" aria-expanded="false">创作<span class="nav-dropdown-caret"></span></button>
                    <div class="nav-dropdown-menu" hidden>
                        <a class="nav-dropdown-item" href="/editor">写文章</a>
                        <a class="nav-dropdown-item" href="/drafts">草稿</a>
                        <a class="nav-dropdown-item" href="/hidden">隐藏</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-question">
        <div class="question-editor-head">
            <h1 class="page-title" id="questionPageTitle">添加题目</h1>
            <a class="daily-link" href="/daily">← 返回每日一题</a>
        </div>

        <section class="daily-card">
            <form id="questionForm">
                <div class="question-form-row">
                    <div class="form-group">
                        <label for="qCategory">分类 *</label>
                        <input type="text" id="qCategory" list="categoryOptions" placeholder="C++ / Linux / MySQL" maxlength="50" required>
                        <datalist id="categoryOptions"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="qDifficulty">难度</label>
                        <select id="qDifficulty">
                            <option value="1">基础</option>
                            <option value="2" selected>进阶</option>
                            <option value="3">困难</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="qStatus">状态</label>
                        <select id="qStatus">
                            <option value="1" selected>已发布</option>
                            <option value="0">草稿</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="qTags">标签（逗号分隔，可选）</label>
                    <input type="text" id="qTags" maxlength="200" placeholder="智能指针,RAII">
                </div>

                <div class="form-group">
                    <label for="qQuestion">题干 *（支持 Markdown）</label>
                    <textarea id="qQuestion" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <div class="question-label-row">
                        <label for="qAnswer">答案 *（支持 Markdown / 代码块 / mermaid）</label>
                        <button type="button" class="daily-link" id="previewToggle" aria-expanded="false" aria-controls="answerPreview">预览</button>
                    </div>
                    <textarea id="qAnswer" rows="14" required></textarea>
                    <div class="question-preview markdown-body" id="answerPreview" hidden></div>
                </div>

                <div class="question-form-actions">
                    <button type="submit" class="btn btn-primary" id="qSaveBtn">保存</button>
                    <a class="btn btn-secondary" href="/daily">返回</a>
                    <span class="question-form-hint" id="qFormHint"></span>
                </div>
            </form>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/daily-common.js"></script>
    <script src="/js/daily-question.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

</body>
</html>
