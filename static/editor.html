<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 · 我的博客</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">我的博客</a>
                <span class="site-tagline">基于 C++ Crow + MySQL 构建</span>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/editor" class="btn-write">写文章</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container">
        <div class="editor-card">
            <h1 id="editorTitle">写文章</h1>
            <form id="postForm">
                <div class="form-group">
                    <label for="title">标题 *</label>
                    <input type="text" id="title" placeholder="输入文章标题..." required>
                </div>
                <div class="form-group">
                    <label for="author">作者</label>
                    <input type="text" id="author" placeholder="作者名（留空默认为「匿名」）">
                </div>
                <div class="form-group">
                    <label for="content">正文</label>
                    <textarea id="content" placeholder="写下你的内容..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">发布</button>
                    <a href="/" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/editor.js"></script>
</body>
</html>
