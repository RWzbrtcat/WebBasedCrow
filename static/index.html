<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/" class="active">首页</a>
                <a href="/daily">每日一题</a>
                <a href="/practice">练习闯关</a>
                <div class="nav-dropdown nav-create" data-auth-role="admin" hidden>
                    <button type="button" class="nav-create-toggle" aria-haspopup="true" aria-expanded="false">创作<span class="nav-dropdown-caret"></span></button>
                    <div class="nav-dropdown-menu" hidden>
                        <a class="nav-dropdown-item" href="/editor">写文章</a>
                        <a class="nav-dropdown-item" href="/drafts">草稿</a>
                        <a class="nav-dropdown-item" href="/hidden">隐藏</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- 主体：三栏 Dashboard（左=最近文章 / 右上=每日一题 / 右下=练习闯关） -->
    <main class="container container-home">
        <div class="home-dashboard">
            <!-- 左栏：最近修改的文章 -->
            <section class="dash-card dash-posts" aria-labelledby="dashPostsTitle">
                <div class="dash-head">
                    <h2 class="dash-title" id="dashPostsTitle">最近更新</h2>
                    <a class="dash-more" href="/posts">全部文章 <span aria-hidden="true">→</span></a>
                </div>
                <ul class="dash-post-list" id="dashPostList">
                    <li class="dash-loading">加载中…</li>
                </ul>
                <div class="dash-foot" id="dashPostsFoot"></div>
            </section>

            <!-- 右栏：上下两卡 -->
            <div class="dash-col-side">
                <!-- 每日一题：整卡进入每日一题页 -->
                <a class="dash-card dash-daily" href="/daily">
                    <div class="dash-card-top">
                        <span class="dash-eyebrow">每日一题</span>
                        <span class="dash-date" id="dashDailyDate"></span>
                    </div>
                    <p class="dash-daily-q" id="dashDailyQuestion">加载中…</p>
                    <div class="dash-card-foot">
                        <span class="dash-meta" id="dashDailyMeta"></span>
                        <span class="dash-streak" id="dashDailyStreak"></span>
                    </div>
                </a>

                <!-- 练习闯关：整卡进入练习页 -->
                <a class="dash-card dash-practice" href="/practice">
                    <div class="dash-card-top">
                        <span class="dash-eyebrow">练习闯关</span>
                        <span class="dash-meta" id="dashPracticeMeta">加载中…</span>
                    </div>
                    <div class="dash-practice-body">
                        <span class="dash-pct" id="dashPracticePct">—</span>
                    </div>
                    <div class="dash-progress">
                        <div class="dash-progress-bar"><span id="dashPracticeBar"></span></div>
                        <span class="dash-progress-text" id="dashPracticeText"></span>
                    </div>
                    <div class="dash-card-foot">
                        <span class="dash-hint">继续刷题 →</span>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
