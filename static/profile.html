<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/drafts">草稿</a>
                <a href="/hidden">隐藏</a>
                <a href="/editor">创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-login">
        <div class="profile-card">
            <h1 class="profile-heading">个人资料</h1>

            <section class="profile-section">
                <h2 class="profile-section-title">基本信息</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" disabled>
                    </div>
                    <div class="form-group">
                        <label for="nickname">昵称</label>
                        <input type="text" id="nickname" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label>头像</label>
                        <div class="profile-avatar-row">
                            <img id="avatarPreview" class="profile-avatar" alt="头像预览" hidden>
                            <div class="profile-avatar-actions">
                                <input type="text" id="avatar" placeholder="头像图片链接" maxlength="500">
                                <button type="button" class="btn btn-secondary" id="avatarUploadBtn">上传图片</button>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <p class="profile-error" id="profileError" hidden></p>
                </form>
            </section>

            <section class="profile-section">
                <h2 class="profile-section-title">账号安全</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="oldPassword">当前密码</label>
                        <input type="password" id="oldPassword" autocomplete="current-password" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" placeholder="至少 6 位" autocomplete="new-password" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码</label>
                        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">修改密码</button>
                    <p class="profile-error" id="passwordError" hidden></p>
                </form>
            </section>
        </div>
    </main>

    <input type="file" id="avatarFileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>

    <script src="/js/profile.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
