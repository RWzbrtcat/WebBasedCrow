<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员管理 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/posts">文章列表</a>
                <a href="/daily">每日一题</a>
                <a href="/practice">练习闯关</a>
                <div class="nav-dropdown nav-create" data-auth-role="admin" hidden>
                    <button type="button" class="nav-create-toggle" aria-haspopup="true" aria-expanded="false">创作<span class="nav-dropdown-caret"></span></button>
                    <div class="nav-dropdown-menu" hidden>
                        <a class="nav-dropdown-item" href="/editor">写文章</a>
                        <a class="nav-dropdown-item" href="/drafts">草稿</a>
                        <a class="nav-dropdown-item" href="/hidden">隐藏</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-admin">
        <div class="admin-layout">
            <section class="admin-panel">
                <h1 class="admin-title">添加管理员</h1>
                <form id="adminForm">
                    <div class="form-group">
                        <label for="emailPrefix">登录账号</label>
                        <div class="input-affix">
                            <input type="text" id="emailPrefix" placeholder="用户名" autocomplete="off" spellcheck="false" required>
                            <span class="input-affix-suffix">@lazycat.com</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="自定义密码" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">添加管理员</button>
                    <p class="login-error" id="adminError" hidden></p>
                </form>
            </section>

            <section class="admin-panel">
                <button type="button" class="admin-toggle" id="adminToggle" aria-expanded="false" aria-controls="adminList">
                    <span>查看已有管理员</span>
                    <span class="admin-count" id="adminCount"></span>
                    <span class="admin-toggle-caret"></span>
                </button>
                <div class="admin-list" id="adminList" hidden>
                    <div class="admin-loading">加载中...</div>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

</body>
</html>
