<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/" class="active">首页</a>
                <a href="/daily">每日一题</a>
                <a href="/drafts" data-auth-role="admin" hidden>草稿</a>
                <a href="/hidden" data-auth-role="admin" hidden>隐藏</a>
                <a href="/editor" data-auth-role="admin" hidden>创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-home">
        <div class="home-main">
            <h1 class="page-title" id="pageTitle">全部文章</h1>
            <p class="page-subtitle">记录技术 · 分享生活</p>

            <!-- 顶部双层筛选条：第一层专栏，第二层主题 -->
            <div class="filter-bar">
                <div class="filter-row" id="topicTabs"></div>
                <div class="filter-row filter-row-theme" id="themeTabs" hidden></div>
            </div>

            <div class="topic-add" id="topicAdd" hidden>
                <input type="text" id="topicAddInput" placeholder="新专栏名称" maxlength="100">
                <button type="button" class="btn btn-primary" id="topicAddConfirm">添加</button>
                <button type="button" class="btn btn-secondary" id="topicAddCancel">取消</button>
            </div>

            <!-- 每日一题：今日题目，答案点开才显示 -->
            <section class="home-daily" id="homeDaily" hidden>
                <div class="daily-card-head">
                    <span class="daily-badge">每日一题</span>
                    <span class="daily-date" id="homeDailyDate"></span>
                    <span class="daily-meta" id="homeDailyMeta"></span>
                </div>
                <p class="home-daily-question" id="homeDailyQuestion"></p>
                <div class="home-daily-actions">
                    <button type="button" class="btn btn-primary" id="homeDailyReveal">查看答案</button>
                    <a class="btn btn-secondary" href="/daily">进入每日一题</a>
                    <span class="daily-streak" id="homeDailyStreak"></span>
                </div>
                <div class="daily-answer" id="homeDailyAnswer" hidden></div>
            </section>

            <div id="postList" class="post-list">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/list.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
