<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐藏文章 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-mode="hidden">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/posts">文章列表</a>
                <a href="/daily">每日一题</a>
                <a href="/practice">练习闯关</a>
                <div class="nav-dropdown nav-create" data-auth-role="admin" hidden>
                    <button type="button" class="nav-create-toggle" aria-haspopup="true" aria-expanded="false">创作<span class="nav-dropdown-caret"></span></button>
                    <div class="nav-dropdown-menu" hidden>
                        <a class="nav-dropdown-item" href="/editor">写文章</a>
                        <a class="nav-dropdown-item" href="/drafts">草稿</a>
                        <a class="nav-dropdown-item" href="/hidden">隐藏</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container">
        <h1 class="page-title" id="pageTitle">隐藏文章</h1>
        <p class="page-subtitle">已隐藏的文章对访客不可见，可在此恢复显示</p>

        <div id="postList" class="post-list">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/list.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

</body>
</html>
