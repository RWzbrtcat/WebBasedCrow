<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="post-page">
    <!-- 站点头部（灵动岛式悬浮胶囊） -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">返回主页面</a>
                <span id="postAdminActions"></span>
                <a href="/logout" data-auth-role="admin" hidden>退出</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container">
        <div id="postDetail">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <!-- 底部浮动互动栏 -->
    <div class="floating-actions" id="floatingActions" hidden>
        <button type="button" class="fab-btn" id="likeBtn">
            <svg class="fab-like-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="likeBtnText">点赞 · 0</span>
        </button>
        <button type="button" class="fab-btn" id="commentBtn">
            <svg class="fab-comment-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="commentBtnText">评论 · 0</span>
        </button>
        <span class="fab-divider"></span>
        <button type="button" class="fab-btn" id="donateBtn">
            <svg class="fab-donate-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
            <span>打赏</span>
        </button>
    </div>

    <!-- 右侧评论抽屉 -->
    <div class="comment-drawer-overlay" id="commentDrawer" hidden>
        <div class="comment-drawer" role="dialog" aria-modal="true" aria-labelledby="commentDrawerTitle">
            <div class="comment-drawer-header">
                <h2 class="comments-title" id="commentDrawerTitle">评论 <span id="commentCount">0</span></h2>
                <button type="button" class="image-modal-close" id="commentDrawerClose" aria-label="关闭">&times;</button>
            </div>
            <div class="comments-list" id="commentsList">
                <div class="loading">加载中...</div>
            </div>
            <form class="comment-form" id="commentForm">
                <input type="text" id="commentNickname" placeholder="昵称（可选，留空为匿名）" maxlength="50">
                <textarea id="commentContent" placeholder="写下你的评论..." required></textarea>
                <button type="submit" class="btn btn-primary">发表评论</button>
            </form>
        </div>
    </div>

    <!-- 打赏弹窗 -->
    <div class="image-modal-overlay" id="donateModal" hidden>
        <div class="image-modal donate-modal" role="dialog" aria-modal="true" aria-labelledby="donateModalTitle">
            <div class="image-modal-header">
                <h3 id="donateModalTitle">打赏支持</h3>
                <button type="button" class="image-modal-close" id="donateModalClose" aria-label="关闭">&times;</button>
            </div>
            <div class="image-modal-body donate-body">
                <p class="donate-tip">如果文章对你有帮助，欢迎打赏支持～</p>
                <div class="donate-tabs">
                    <button type="button" class="donate-tab active" data-tab="wechat">微信</button>
                    <button type="button" class="donate-tab" data-tab="zfb">支付宝</button>
                </div>
                <div class="donate-qr-pane" data-qr="wechat">
                    <img id="donateQrWechat" src="/uploads/wechat.jpg" alt="微信收款码" class="donate-qr">
                </div>
                <div class="donate-qr-pane" data-qr="zfb" hidden>
                    <img id="donateQrZfb" src="/uploads/zfb.jpg" alt="支付宝收款码" class="donate-qr">
                </div>
                <p class="donate-hint">扫码或长按识别二维码打赏</p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/post.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
