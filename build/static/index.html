<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理系统 - C++ Web</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
                <h1>任务管理系统</h1>
            </div>
            <p class="subtitle">基于 C++ Crow + MySQL 构建</p>
        </header>

        <main>
            <!-- 统计面板 -->
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">总任务</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="pendingTasks">0</span>
                    <span class="stat-label">待完成</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">已完成</span>
                </div>
            </div>

            <!-- 新建任务表单 -->
            <div class="form-card">
                <h2>✨ 新建任务</h2>
                <form id="taskForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">任务标题 *</label>
                            <input type="text" id="title" placeholder="输入任务标题..." required>
                        </div>
                        <div class="form-group priority-group">
                            <label for="priority">优先级</label>
                            <select id="priority">
                                <option value="1">🔴 高优先级</option>
                                <option value="2" selected>🟡 中优先级</option>
                                <option value="3">🟢 低优先级</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">任务描述</label>
                        <textarea id="description" rows="2" placeholder="添加详细描述（可选）..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        添加任务
                    </button>
                </form>
            </div>

            <!-- 任务列表 -->
            <div class="tasks-section">
                <div class="section-header">
                    <h2>📋 任务列表</h2>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="pending">待办</button>
                        <button class="filter-btn" data-filter="completed">已完成</button>
                    </div>
                </div>
                <div id="taskList" class="task-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ 编辑任务</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>任务标题</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label>优先级</label>
                    <select id="editPriority">
                        <option value="1">🔴 高优先级</option>
                        <option value="2">🟡 中优先级</option>
                        <option value="3">🟢 低优先级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>任务描述</label>
                    <textarea id="editDescription" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
