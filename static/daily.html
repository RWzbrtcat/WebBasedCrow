<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一题 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="daily-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/daily" class="active">每日一题</a>
                <a href="/drafts" data-auth-role="admin" hidden>草稿</a>
                <a href="/hidden" data-auth-role="admin" hidden>隐藏</a>
                <a href="/editor" data-auth-role="admin" hidden>创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-daily">
        <h1 class="page-title">每日一题</h1>
        <p class="page-subtitle">每天一道后端面试题 · C++ / Linux / MySQL / Redis / 网络 / 操作系统 / 算法 · 答案点开才显示</p>

        <div class="daily-layout">
            <!-- 主栏：今日题目 + 题库浏览 -->
            <div class="daily-main">
                <!-- 今日题目 -->
                <section class="daily-card" id="todayCard">
                    <div class="loading">加载中...</div>
                </section>

                <!-- 题库：分类筛选 + 列表 -->
                <div class="daily-section-head">
                    <h2 class="daily-section-title">题库</h2>
                    <span class="daily-section-note" id="bankCount"></span>
                </div>
                <div class="filter-bar">
                    <div class="filter-row" id="categoryTabs"></div>
                </div>
                <div class="daily-list" id="questionList">
                    <div class="loading">加载中...</div>
                </div>
                <div class="daily-more">
                    <button type="button" class="btn btn-secondary" id="loadMoreBtn" hidden>加载更多</button>
                </div>
            </div>

            <!-- 侧栏：历史题目 + 题目管理 -->
            <aside class="daily-aside">
                <section class="daily-side-card">
                    <h2 class="daily-side-title">历史题目</h2>
                    <div class="daily-history" id="historyList">
                        <div class="loading">加载中...</div>
                    </div>
                </section>

                <!-- 题目管理（仅站长可见）：按钮跳转到独立的出题页 -->
                <section class="daily-side-card" id="bankAdmin" data-auth-role="main" hidden>
                    <h2 class="daily-side-title">题目管理</h2>
                    <a class="btn btn-primary btn-block" href="/daily/question" id="addQuestionBtn">添加题目</a>
                    <p class="daily-side-hint">
                        答案支持 Markdown，画图用 <code>```mermaid</code>。<br>
                        也可导入 <code>tools/seed_questions.sql</code> 批量补题。
                    </p>
                </section>
            </aside>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/daily-common.js"></script>
    <script src="/js/daily.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
