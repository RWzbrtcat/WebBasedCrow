<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目详情 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="daily-q-page">
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/daily" class="active">每日一题</a>
                <a href="/drafts" data-auth-role="admin" hidden>草稿</a>
                <a href="/hidden" data-auth-role="admin" hidden>隐藏</a>
                <a href="/editor" data-auth-role="admin" hidden>创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体：左「题干 + 参考答案」+ 右「同分类相关题」。
         窄屏或没有相关题时（JS 撤掉 .has-related）回落成居中单列。 -->
    <main class="container container-q">
        <div class="qdetail-layout" id="qDetailLayout">
            <div class="qdetail-main">
                <nav class="qdetail-nav">
                    <a class="daily-link" href="/daily">← 返回每日一题</a>
                    <a class="daily-link daily-link-edit" href="/daily/question" id="qEditLink" hidden>编辑此题</a>
                </nav>

                <article class="daily-card qdetail-card" id="qDetail">
                    <div class="loading">加载中...</div>
                </article>
            </div>

            <aside class="qdetail-aside" id="qRelated" hidden aria-label="同分类相关题">
                <h2 class="daily-side-title" id="qRelatedTitle">同分类相关题</h2>
                <div class="qdetail-related-list" id="qRelatedList"></div>
            </aside>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/daily-common.js"></script>
    <script src="/js/daily-q.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
