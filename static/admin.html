<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员管理 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/drafts">草稿</a>
                <a href="/hidden">隐藏</a>
                <a href="/editor">创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-admin">
        <div class="admin-layout">
            <section class="admin-panel">
                <h1 class="admin-title">添加管理员</h1>
                <form id="adminForm">
                    <div class="form-group">
                        <label for="emailPrefix">登录账号</label>
                        <div class="input-affix">
                            <input type="text" id="emailPrefix" placeholder="用户名" autocomplete="off" spellcheck="false" required>
                            <span class="input-affix-suffix">@lazycat.com</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="自定义密码" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">添加管理员</button>
                    <p class="login-error" id="adminError" hidden></p>
                </form>
            </section>

            <section class="admin-panel">
                <h2 class="admin-title-sm">已有管理员<span class="admin-count" id="adminCount"></span></h2>
                <div class="admin-list" id="adminList">
                    <div class="admin-loading">加载中...</div>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
