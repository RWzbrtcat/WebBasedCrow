<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 站点头部 -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/drafts">草稿</a>
                <a href="/hidden">隐藏</a>
                <a href="/editor">创作</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container container-login">
        <div class="profile-card">
            <div class="profile-avatar-block">
                <button type="button" class="profile-avatar-picker" id="avatarPicker" aria-label="更改头像">
                    <img id="avatarPreview" class="profile-avatar-lg" alt="头像预览" hidden>
                    <span class="profile-avatar-placeholder" id="avatarPlaceholder">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </span>
                    <span class="profile-avatar-overlay" id="avatarOverlay">更改头像</span>
                </button>
            </div>

            <h1 class="profile-heading">个人资料</h1>

            <section class="profile-section">
                <h2 class="profile-section-title">基本信息</h2>
                <form id="profileForm">
                    <input type="hidden" id="avatar">
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" disabled>
                    </div>
                    <div class="form-group">
                        <label for="nickname">昵称</label>
                        <input type="text" id="nickname" maxlength="100" required>
                    </div>
                    <div class="profile-actions">
                        <button type="button" class="btn btn-secondary" id="openPasswordBtn">修改密码</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                    <p class="profile-error" id="profileError" hidden></p>
                </form>
            </section>
        </div>
    </main>

    <!-- 修改密码弹窗 -->
    <div class="image-modal-overlay" id="passwordModal" hidden>
        <div class="image-modal password-modal" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
            <div class="image-modal-header">
                <h3 id="passwordModalTitle">修改密码</h3>
                <button type="button" class="image-modal-close" id="passwordModalClose" aria-label="关闭">&times;</button>
            </div>
            <form id="passwordForm" class="image-modal-body">
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" placeholder="至少 6 位" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
                </div>
                <p class="profile-error" id="passwordError" hidden></p>
                <div class="password-modal-actions">
                    <button type="button" class="btn btn-secondary" id="passwordCancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <input type="file" id="avatarFileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>

    <script src="/js/profile.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>

    <footer class="site-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026039047号</a>
    </footer>
</body>
</html>
