<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习闯关 · LazyCat's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/highlight.css">
</head>
<body class="practice-page">
    <!-- 站点头部：左品牌 / 中答题操作 / 右导航（操作随题型切换，见 practice.js syncActions） -->
    <header class="site-header site-header-pill">
        <div class="header-inner">
            <div class="brand">
                <a class="site-title" href="/">LazyCat</a>
            </div>
            <nav class="nav">
                <a href="/daily">每日一题</a>
                <a href="/practice" class="active">练习闯关</a>
            </nav>
            <!-- 操作区容器常驻（不设 hidden）：保证头部三栏网格始终成立、操作恒居中；
                 只切换内部按钮（见 practice.js syncActions） -->
            <div class="practice-top-actions" id="topActions">
                <button type="button" class="btn btn-primary" id="submitBtn" hidden>提交运行</button>
                <button type="button" class="btn btn-secondary" id="resetBtn" hidden>重置代码</button>
                <button type="button" class="btn btn-primary" id="answerSubmitBtn" hidden>提交答案</button>
            </div>
        </div>
    </header>

    <!-- 主体：整页平铺工作台（正文不滚，各面板独立滚动） -->
    <main class="container container-practice">
        <div class="practice-layout">
            <!-- 左栏：章节 + 当前章题目（两级树，自身滚动；进度并入栏头） -->
            <aside class="practice-side">
                <div class="practice-side-head">
                    <span>章节</span>
                    <span class="practice-progress" id="practiceProgress"></span>
                </div>
                <div class="practice-chapters" id="chapterList">
                    <div class="loading">加载中...</div>
                </div>
            </aside>

            <!-- 右栏：答题工作台 -->
            <div class="practice-work">
                <!-- 题目头（固定在工作台顶部） -->
                <div class="practice-work-head" id="workHead" hidden></div>

                <!-- 并排主体：题目描述卡 | 编辑器·作答 -->
                <div class="practice-work-body single" id="workBody">
                    <!-- 题目描述卡：标签栏（题目描述 | 题解 | 测试结果）共用一栏 -->
                    <section class="practice-card practice-prompt-card" id="questionCard">
                        <div class="practice-tabs" role="tablist" aria-label="题目内容">
                            <button type="button" class="practice-tab is-active" id="tabDesc" role="tab"
                                aria-selected="true" aria-controls="descPane">题目描述</button>
                            <button type="button" class="practice-tab" id="tabSolution" role="tab"
                                aria-selected="false" aria-controls="solutionPane">题解</button>
                            <button type="button" class="practice-tab" id="tabResult" role="tab"
                                aria-selected="false" aria-controls="resultPane">测试结果<i
                                    class="practice-tab-dot" aria-hidden="true"></i></button>
                        </div>
                        <!-- 面板一：题目描述（默认显示） -->
                        <div class="practice-desc-scroll" id="descPane" role="tabpanel" aria-labelledby="tabDesc">
                            <div id="promptHost">
                                <div class="practice-prompt practice-empty">从左侧选择一道题目开始练习。</div>
                            </div>
                        </div>
                        <!-- 面板二：题解（点「题解」标签后显示） -->
                        <div class="practice-desc-scroll" id="solutionPane" role="tabpanel"
                            aria-labelledby="tabSolution" hidden>
                            <div class="practice-solution-host" id="solutionHost"></div>
                        </div>
                        <!-- 面板三：测试结果（运行/提交后自动切过来；无结果时显示空态或本题上次结果） -->
                        <div class="practice-desc-scroll" id="resultPane" role="tabpanel"
                            aria-labelledby="tabResult" hidden>
                            <section class="practice-result" id="resultCard">
                                <div class="practice-result-body" id="resultBody"></div>
                            </section>
                        </div>
                    </section>

                    <!-- 写代码题：代码编辑器（IDE 观感：行号槽 + 语法高亮 + 状态栏）
                         顶部工具条与底部操作条已上移头部与状态栏，编辑器吃满整卡 -->
                    <section class="practice-card practice-editor-card" id="editorCard" hidden>
                        <div class="practice-code" id="codeShell">
                            <div class="practice-code-bar">
                                <div class="practice-code-bar-left">
                                    <span class="practice-code-file"><i class="practice-code-dot" aria-hidden="true"></i>solution.cpp</span>
                                    <span class="practice-code-tip">Ctrl / ⌘ + Enter 运行</span>
                                </div>
                                <div class="practice-code-tools">
                                    <div class="practice-code-theme">
                                        <label class="practice-code-theme-label" for="codeTheme">主题</label>
                                        <select id="codeTheme" class="practice-code-theme-select" aria-label="代码编辑器主题">
                                            <option value="dark">暗黑 +</option>
                                            <option value="light">浅色 +</option>
                                            <option value="solarized">Solarized Dark</option>
                                            <option value="monokai">Monokai</option>
                                        </select>
                                    </div>
                                    <!-- 代码字号：A− / A+ 步进（Ctrl / ⌘ + 滚轮也可缩放），localStorage 持久化 -->
                                    <div class="practice-code-font" id="codeFont" role="group" aria-label="代码字号">
                                        <span class="practice-code-theme-label" aria-hidden="true">字号</span>
                                        <button type="button" class="practice-code-font-btn" id="codeFontDown"
                                            title="减小字号（Ctrl / ⌘ + 滚轮向下）" aria-label="减小代码字号">A<span
                                                class="practice-code-font-sign">−</span></button>
                                        <output class="practice-code-font-val" id="codeFontVal"
                                            title="当前代码字号（px）" aria-live="polite">13</output>
                                        <button type="button" class="practice-code-font-btn" id="codeFontUp"
                                            title="增大字号（Ctrl / ⌘ + 滚轮向上）" aria-label="增大代码字号">A<span
                                                class="practice-code-font-sign">+</span></button>
                                    </div>
                                </div>
                            </div>
                            <div class="practice-code-main">
                                <div class="practice-code-gutter" id="codeGutter" aria-hidden="true"><div class="practice-code-gutter-inner" id="codeGutterInner">1</div></div>
                                <div class="practice-code-body">
                                    <div class="practice-code-currentline" id="codeCurrentLine" aria-hidden="true"></div>
                                    <pre class="practice-code-hl" aria-hidden="true"><code id="codeHighlight"></code></pre>
                                    <textarea id="codeEditor" class="practice-code-input" spellcheck="false"
                                        autocomplete="off" autocapitalize="off" autocorrect="off"
                                        aria-label="C++ 代码编辑器"
                                        placeholder="在这里编写你的 C++ 代码..."></textarea>
                                </div>
                            </div>
                            <div class="practice-code-status">
                                <span id="codeStatusPos">行 1，列 1</span>
                                <span class="practice-code-status-right">C++20 · 缩进 4 空格 · UTF-8</span>
                            </div>
                        </div>
                    </section>

                    <!-- 客观题（选择题）：作答区（提交按钮在头部操作区） -->
                    <section class="practice-card practice-answer-card" id="answerCard" hidden>
                        <div class="practice-answer-body" id="answerBody"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/daily-common.js"></script>
    <script src="/js/practice.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
